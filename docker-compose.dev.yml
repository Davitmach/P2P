services:
  postgres:
    image: postgres:16.15-alpine3.23
    container_name: p2p-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: p2p-redis-dev
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: p2p-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prisma-generate:
    build:
      context: .
      dockerfile: Dockerfile.prisma
    container_name: p2p-prisma-generate-dev
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: npx prisma generate
    restart: "no"

  prisma-migrate:
    build:
      context: .
      dockerfile: Dockerfile.prisma
    container_name: p2p-prisma-migrate-dev
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    volumes:
      - .:/app
      - /app/node_modules
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
      prisma-generate:
        condition: service_completed_successfully
    restart: "no"

  rabbitmq-init:
    image: node:22.23.3-alpine3.24
    container_name: p2p-rabbitmq-init-dev
    working_dir: /app
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL_DOCKER}
    volumes:
      - ./rabbitmq-init.js:/app/rabbitmq-init.js:ro
    command: >
      sh -c "
        npm install --no-save amqplib &&
        node rabbitmq-init.js
      "
    depends_on:
      rabbitmq:
        condition: service_healthy
        restart: true
    restart: "no"

  p2p-bot:
    build:
      context: .
      dockerfile: apps/P2P-bot/Dockerfile
      target: dev
    container_name: p2p-bot-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: ${RABBITMQ_URL_DOCKER}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        restart: true
      prisma-generate:
        condition: service_completed_successfully
      prisma-migrate:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully

  market:
